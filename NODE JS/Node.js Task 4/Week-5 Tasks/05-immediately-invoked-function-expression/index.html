<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immediately Invoked Function Expression</title>
</head>
<body>
    <script>
    (function()
    {
        let num=54;
        let result=num/2;

        console.log("Result of the Mathematical Operation (54 / 2):"+ result)

    })();
    </script>
</body>
</html>
