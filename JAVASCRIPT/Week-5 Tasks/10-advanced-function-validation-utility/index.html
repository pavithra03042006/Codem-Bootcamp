<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Function Validation Utility</title>
</head>
<body>
    <form onsubmit=" return ValidationForm()">
        <h1>Advanced Function Validation Utility</h1>
        Name: <input type="text" id="name" placeholder="Enter your name:"><br><br>
        Email: <input type="name" id="email" placeholder="Enter your email:"><br><br>
        Password: <input type="password" id="password" placeholder="Enter your password:"><br><br>
        <button type="submit">Submit</button>
    </form>
    <script>
        function checkEmpty(value)
        {
            if(value === "")
            {
                return true;
            }
            return false;
        }

        function checkEmailFormat(email)
        {
            if(email.includes("@") && email.includes("."))
            {
                return true;
            }
            return false;
        }

        function checkPasswordLength(password)
        {
            if(password.length >= 8)
            {
                return true;
            }
            return false;
        }
        function ValidationForm() 
        {
            let Name=document.getElementById("name").value;
            let Email=document.getElementById("email").value;
            let Password=document.getElementById("password").value;
        let valid=true;
        if(checkEmpty(Name))
        {
            console.log("Name Field is empty...!");
            valid=false;
        }
        else if(checkEmpty(Email))
        {
            console.log("Email Field is empty...!");
            valid=false;
        }
        else if(checkEmpty(Password))
        {
            console.log("Password Field is empty...!");
            valid=false;
        }
        else if(!checkEmailFormat(Email))
        {
            console.log("Invalid Email Format!");
            valid=false;
        }
        else if(!checkPasswordLength(Password))
        {
            console.log("Password must be at least 8 characters long!");
            valid=false;
        }
        if(valid)
        {
            console.log("Form Submitted Successfully...");
        }
        
        return valid;

        }
    </script>
    
</body>
</html>
